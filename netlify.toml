# Netlify configuration for RAG V2 Frontend

[build]
  # Base directory - where your package.json is located
  base = "frontend"
  
  # Build command
  command = "pnpm install && pnpm run build"
  
  # Publish directory - where your built files are (matching vite.config.ts outDir)
  publish = "dist/public"

# Force HTTPS redirect - must come before SPA redirect
[[redirects]]
  from = "http://ragv2.netlify.app/*"
  to = "https://ragv2.netlify.app/:splat"
  status = 301
  force = true

# SPA routing - redirect all requests to index.html for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Environment variables are set in the Netlify UI under:
# Site settings > Environment variables
# Make sure you've added:
# - VITE_FIREBASE_API_KEY
# - VITE_FIREBASE_AUTH_DOMAIN
# - VITE_FIREBASE_PROJECT_ID
# - VITE_FIREBASE_STORAGE_BUCKET
# - VITE_FIREBASE_MESSAGING_SENDER_ID
# - VITE_FIREBASE_APP_ID

[build.environment]
  # Use pnpm instead of npm
  NPM_FLAGS = "--version"
  NODE_VERSION = "20"
